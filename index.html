<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background-color: #ffcccc;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .popup {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            display: inline-block;
            position: relative;
        }
        .heart-btn {
            border: none;
            background: red;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 50%;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .heart-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
        .heart-container {
            margin-top: 20px;
        }
        img {
            width: 150px;
            border-radius: 15px;
            margin: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="popup">
            <h2>Hiii Dugii</h2>
            <p>Will you be my valentine??</p>
            <img src="https://tenor.com/en-IN/view/có-biết-gì-đâu-gif-3821483482478003423" alt="Cute GIF">
            <div class="heart-container">
                <button class="heart-btn" onclick="sayYes()">Yes</button>
                <button class="heart-btn" onclick="sayNo()">No</button>
            </div>
        </div>
    </div>

    <script>
        let noCount = 0;
        function sayNo() {
            noCount++;
            if (noCount >= 5) {
                document.body.innerHTML = `
                    <div class="container">
                        <div class="popup">
                            <h2>Will kidnap you otherwise HMPH!</h2>
                            <img src="https://tenor.com/en-IN/view/tonibear-bubu-duddu-panda-bear-gif-17553640072061844572" alt="Kidnap GIF">
                        </div>
                    </div>`;
            }
        }

        function sayYes() {
            document.body.innerHTML = `
                <div class="container">
                    <div class="popup">
                        <h2>I Love you a lottttttt</h2>
                        <p>My valentine for life!</p>
                        <p>You make my heart go dhudhudhudhudhu</p>
                        <img src="https://tenor.com/en-IN/view/robert-bri-cute-hug-gif-5869006706266344939" alt="Hug GIF">
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
